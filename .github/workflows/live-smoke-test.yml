name: Live External API Smoke Test

on:
  workflow_dispatch:
  schedule:
    # Run once daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'

jobs:
  smoke-test:
    name: Authenticated CPCB & Gemini Integration Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Live CPCB & Gemini Integration Tests
        run: LIVE_INTEGRATION=true npx vitest run tests/integration/cpcb-live.test.ts tests/integration/gemini-live.test.ts
        env:
          LIVE_INTEGRATION: 'true'
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
