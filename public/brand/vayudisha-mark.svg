<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%" aria-label="VayuDisha Logo Mark">
  <defs>
    <!-- Forest Green to Teal Leaf Gradient -->
    <linearGradient id="leafGrad" x1="20%" y1="90%" x2="80%" y2="10%">
      <stop offset="0%" stop-color="#174B36" />
      <stop offset="60%" stop-color="#159C89" />
      <stop offset="100%" stop-color="#1FAF96" />
    </linearGradient>

    <!-- Flowing Breeze Line Gradient -->
    <linearGradient id="breezeGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#A7C5A0" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#A7C5A0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#159C89" />
    </linearGradient>

    <!-- Warm Indian Saffron Compass Accent -->
    <linearGradient id="saffronGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E07A18" />
      <stop offset="100%" stop-color="#EBA347" />
    </linearGradient>

    <!-- Soft Ambient Halo -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#159C89" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#159C89" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="50" cy="50" r="46" fill="url(#halo)" />

  <!-- Outer Dynamic Air Ring (Subtle guide compass ring) -->
  <circle cx="50" cy="50" r="42" stroke="#A7C5A0" stroke-width="1.75" stroke-dasharray="3 6" opacity="0.45" />

  <!-- Flowing Atmospheric Wind Stream 1 (Lower breeze curving up) -->
  <path d="M 12 66 C 24 66, 32 78, 48 76 C 64 74, 76 60, 84 46" 
        stroke="url(#breezeGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Flowing Atmospheric Wind Stream 2 (Upper breeze guiding forward) -->
  <path d="M 18 42 C 28 32, 42 34, 54 38 C 66 42, 74 36, 86 24" 
        stroke="url(#breezeGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />

  <!-- Core Sustainability Leaf (Curved botanical wing forming the compass body) -->
  <path d="M 28 72 C 24 50, 42 26, 76 18 C 78 44, 60 76, 28 72 Z" 
        fill="url(#leafGrad)" />

  <!-- Leaf Central Vein / Aerodynamic Spine -->
  <path d="M 30 70 C 44 58, 58 42, 74 20" 
        stroke="#F6F4EB" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />

  <!-- Directional Compass Element (The "Disha" - Saffron pointer indicating better direction) -->
  <path d="M 50 48 L 78 16 L 68 40 L 58 44 Z" 
        fill="url(#saffronGrad)" />

  <!-- Guidance Star / North-East Pivot Beacon -->
  <circle cx="78" cy="16" r="3.5" fill="#EBA347" />
  <circle cx="78" cy="16" r="1.5" fill="#FFFFFF" />
</svg>
