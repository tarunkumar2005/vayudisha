<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" fill="none" width="100%" height="100%" aria-label="VayuDisha Logo (Dark Theme)">
  <defs>
    <linearGradient id="dkLeaf" x1="20%" y1="90%" x2="80%" y2="10%">
      <stop offset="0%" stop-color="#159C89" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="dkBreeze" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#A7C5A0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="dkSaffron" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E07A18" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <!-- === EMBLEM / SYMBOL === -->
  <g transform="translate(6, 6) scale(0.64)">
    <circle cx="50" cy="50" r="42" stroke="#A7C5A0" stroke-width="2" stroke-dasharray="4 6" opacity="0.3" />
    <path d="M 12 66 C 24 66, 32 78, 48 76 C 64 74, 76 60, 84 46" stroke="url(#dkBreeze)" stroke-width="5" stroke-linecap="round" />
    <path d="M 18 42 C 28 32, 42 34, 54 38 C 66 42, 74 36, 86 24" stroke="url(#dkBreeze)" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 28 72 C 24 50, 42 26, 76 18 C 78 44, 60 76, 28 72 Z" fill="url(#dkLeaf)" />
    <path d="M 30 70 C 44 58, 58 42, 74 20" stroke="#0F2D21" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <path d="M 50 48 L 78 16 L 68 40 L 58 44 Z" fill="url(#dkSaffron)" />
    <circle cx="78" cy="16" r="3.5" fill="#FBBF24" />
  </g>

  <!-- === TYPOGRAPHY / WORDMARK === -->
  <!-- Latin Wordmark: Vayu (Warm Cream) + Disha (Mint Teal) -->
  <text x="82" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#F6F4EB">Vayu</tspan><tspan fill="#2DD4BF">Disha</tspan>
  </text>

  <!-- Devanagari Script Badge: वायुदिशा -->
  <rect x="232" y="21" width="76" height="24" rx="6" fill="#F6F4EB" fill-opacity="0.15" />
  <text x="270" y="38" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Kohinoor Devanagari', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F6F4EB">
    वायुदिशा
  </text>

  <!-- Tagline / Descriptor -->
  <text x="83" y="58" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="10.5" font-weight="600" fill="#A7C5A0" letter-spacing="0.8">
    KNOW YOUR AIR · CHOOSE A BETTER DIRECTION
  </text>
</svg>
