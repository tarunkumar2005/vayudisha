<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F2" />
      <stop offset="60%" stop-color="#F6F4EB" />
      <stop offset="100%" stop-color="#ECE7D8" />
    </linearGradient>
    <linearGradient id="ogLeaf" x1="20%" y1="90%" x2="80%" y2="10%">
      <stop offset="0%" stop-color="#174B36" />
      <stop offset="60%" stop-color="#159C89" />
      <stop offset="100%" stop-color="#1FAF96" />
    </linearGradient>
    <linearGradient id="ogBreeze" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#A7C5A0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#159C89" />
    </linearGradient>
    <linearGradient id="ogSaffron" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E07A18" />
      <stop offset="100%" stop-color="#EBA347" />
    </linearGradient>
    <filter id="ogShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#174B36" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Ambient background rings / compass aura -->
  <circle cx="1050" cy="315" r="420" stroke="#A7C5A0" stroke-width="2" stroke-dasharray="8 12" opacity="0.35" />
  <circle cx="1050" cy="315" r="280" stroke="#159C89" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.25" />
  <circle cx="1050" cy="315" r="140" stroke="#174B36" stroke-width="1" opacity="0.15" />

  <!-- Top Brand Navigation / Header -->
  <g transform="translate(80, 70)">
    <!-- Brand Mark (scale 0.9) -->
    <g transform="translate(0, -6) scale(0.9)">
      <circle cx="50" cy="50" r="42" stroke="#A7C5A0" stroke-width="2" stroke-dasharray="4 6" opacity="0.5" />
      <path d="M 12 66 C 24 66, 32 78, 48 76 C 64 74, 76 60, 84 46" stroke="url(#ogBreeze)" stroke-width="5" stroke-linecap="round" />
      <path d="M 18 42 C 28 32, 42 34, 54 38 C 66 42, 74 36, 86 24" stroke="url(#ogBreeze)" stroke-width="4" stroke-linecap="round" opacity="0.8" />
      <path d="M 28 72 C 24 50, 42 26, 76 18 C 78 44, 60 76, 28 72 Z" fill="url(#ogLeaf)" />
      <path d="M 30 70 C 44 58, 58 42, 74 20" stroke="#F6F4EB" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
      <path d="M 50 48 L 78 16 L 68 40 L 58 44 Z" fill="url(#ogSaffron)" />
      <circle cx="78" cy="16" r="3.5" fill="#EBA347" />
    </g>

    <!-- Wordmark -->
    <text x="100" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      <tspan fill="#174B36">Vayu</tspan><tspan fill="#159C89">Disha</tspan>
    </text>

    <!-- Devanagari Pill -->
    <rect x="330" y="20" width="110" height="36" rx="8" fill="#174B36" fill-opacity="0.08" />
    <text x="385" y="45" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Kohinoor Devanagari', system-ui, sans-serif" font-size="20" font-weight="700" fill="#174B36">
      वायुदिशा
    </text>
  </g>

  <!-- Left Hero Copy -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="260" height="32" rx="16" fill="#159C89" fill-opacity="0.12" />
    <text x="130" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#159C89" letter-spacing="1">
      URBAN AIR INTELLIGENCE
    </text>

    <text x="0" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#174B36" letter-spacing="-1.5">
      Know your air.
    </text>
    <text x="0" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#159C89" letter-spacing="-1.5">
      Choose a better direction.
    </text>

    <text x="0" y="205" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="24" font-weight="600" fill="#587668">
      हवा की समझ, बेहतर कल।
    </text>

    <text x="0" y="255" font-family="system-ui, sans-serif" font-size="18" fill="#4A5568" max-width="500">
      Science-backed daily planner, CPCB ground telemetry, atmospheric forecasts,
    </text>
    <text x="0" y="282" font-family="system-ui, sans-serif" font-size="18" fill="#4A5568">
      safe indoor air guidance, and zero-PII community action for Indian cities.
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 320)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="170" height="38" rx="8" fill="#FFFFFF" stroke="#E2DDD1" />
      <circle cx="16" cy="19" r="5" fill="#10B981" />
      <text x="30" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#174B36">Official CPCB Data</text>

      <!-- Badge 2 -->
      <rect x="185" y="0" width="185" height="38" rx="8" fill="#FFFFFF" stroke="#E2DDD1" />
      <circle cx="201" cy="19" r="5" fill="#159C89" />
      <text x="215" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#174B36">MoHFW/NCDC Aligned</text>

      <!-- Badge 3 -->
      <rect x="385" y="0" width="175" height="38" rx="8" fill="#FFFFFF" stroke="#E2DDD1" />
      <circle cx="401" cy="19" r="5" fill="#EBA347" />
      <text x="415" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#174B36">CAMS Atmospheric</text>
    </g>
  </g>

  <!-- Right Floating Card Preview -->
  <g transform="translate(740, 150)" filter="url(#ogShadow)">
    <rect width="380" height="400" rx="24" fill="#FFFFFF" stroke="#E2DDD1" stroke-width="1.5" />

    <!-- Card Header -->
    <g transform="translate(24, 28)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#587668" letter-spacing="0.5">
        LIVE CITY TELEMETRY
      </text>
      <text x="0" y="44" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#174B36">
        Delhi NCR
      </text>
      <rect x="240" y="4" width="90" height="26" rx="13" fill="#FEE2E2" />
      <text x="285" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#DC2626">
        VERY POOR
      </text>
    </g>

    <!-- AQI Big Number & Gauge Preview -->
    <g transform="translate(24, 115)">
      <text x="0" y="55" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#EF4444" letter-spacing="-2">
        328
      </text>
      <text x="125" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6B7280">
        AQI · CPCB
      </text>
      <text x="125" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF">
        Prominent: PM2.5 (182 µg/m³)
      </text>

      <!-- Gauge arc preview -->
      <path d="M 0 80 Q 165 60 332 80" stroke="#F3F4F6" stroke-width="10" stroke-linecap="round" fill="none" />
      <path d="M 0 80 Q 110 65 240 73" stroke="#EF4444" stroke-width="10" stroke-linecap="round" fill="none" />
    </g>

    <!-- Recommendation Preview Snippet -->
    <g transform="translate(24, 230)">
      <rect width="332" height="130" rx="16" fill="#F6F4EB" stroke="#E2DDD1" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#174B36" letter-spacing="0.5">
        MOHFW/NCDC HEALTH ACTION
      </text>
      <text x="16" y="52" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2937">
        Restrict intense morning exertion
      </text>
      <text x="16" y="74" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">
        Winter morning inversion traps surface particulate.
      </text>
      <text x="16" y="94" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">
        Wear fitted N95/N99 if transit is unavoidable.
      </text>
      <text x="16" y="114" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#159C89">
        ✓ DIY filtration (MERV-13) certified safe alternative
      </text>
    </g>
  </g>
</svg>
