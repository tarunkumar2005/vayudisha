<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" fill="none" width="100%" height="100%" aria-label="VayuDisha Monochrome Logo">
  <!-- === EMBLEM / SYMBOL (X: 6 to 66, Y: 8 to 68) === -->
  <g transform="translate(6, 6) scale(0.64)">
    <circle cx="50" cy="50" r="42" stroke="#111827" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />
    <!-- Lower breeze -->
    <path d="M 12 66 C 24 66, 32 78, 48 76 C 64 74, 76 60, 84 46" stroke="#111827" stroke-width="5" stroke-linecap="round" />
    <!-- Upper breeze -->
    <path d="M 18 42 C 28 32, 42 34, 54 38 C 66 42, 74 36, 86 24" stroke="#111827" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <!-- Leaf -->
    <path d="M 28 72 C 24 50, 42 26, 76 18 C 78 44, 60 76, 28 72 Z" fill="#111827" />
    <!-- Leaf Spine -->
    <path d="M 30 70 C 44 58, 58 42, 74 20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <!-- Pointer (Disha) -->
    <path d="M 50 48 L 78 16 L 68 40 L 58 44 Z" fill="#111827" />
    <circle cx="78" cy="16" r="3.5" fill="#111827" />
  </g>

  <!-- === TYPOGRAPHY / WORDMARK === -->
  <text x="82" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif" font-size="28" font-weight="800" fill="#111827" letter-spacing="-0.5">
    VayuDisha
  </text>

  <!-- Devanagari Script Badge: वायुदिशा -->
  <rect x="232" y="21" width="76" height="24" rx="6" fill="#111827" fill-opacity="0.1" />
  <text x="270" y="38" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Kohinoor Devanagari', system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827">
    वायुदिशा
  </text>

  <!-- Tagline / Descriptor -->
  <text x="83" y="58" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="10.5" font-weight="600" fill="#374151" letter-spacing="0.8">
    KNOW YOUR AIR · CHOOSE A BETTER DIRECTION
  </text>
</svg>
